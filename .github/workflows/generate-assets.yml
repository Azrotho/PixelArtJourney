name: Generate Assets & README

on:
  push:
    branches: [main]

concurrency:
  group: generate-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ASEPRITE_TAG: v1.3.17

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Compiler Aseprite 1.3.17 depuis les sources (avec cache) ──
      - name: Cache Aseprite build
        id: cache-aseprite
        uses: actions/cache@v4
        with:
          path: /tmp/aseprite-build
          key: aseprite-${{ env.ASEPRITE_TAG }}-${{ runner.os }}

      - name: Build Aseprite CLI
        if: steps.cache-aseprite.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Install build dependencies"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ clang \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libfontconfig1-dev
          echo "::endgroup::"

          echo "::group::Clone Aseprite source"
          git clone --recursive https://github.com/aseprite/aseprite.git \
            /tmp/aseprite-src --depth 1 --branch $ASEPRITE_TAG
          echo "::endgroup::"

          echo "::group::Get Skia URL"
          cd /tmp/aseprite-src
          skia_url=$(bash laf/misc/skia-url.sh Release | xargs)
          skia_file=$(basename "$skia_url")
          echo "Skia URL: $skia_url"
          echo "::endgroup::"

          echo "::group::Download & extract Skia"
          curl --ssl-revoke-best-effort -L -o "/tmp/$skia_file" "$skia_url"
          unzip -q "/tmp/$skia_file" -d /tmp/skia
          echo "::endgroup::"

          echo "::group::Compile Aseprite"
          export CC=clang
          export CXX=clang++
          cd /tmp/aseprite-src
          mkdir -p build && cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=/tmp/skia \
            -DSKIA_LIBRARY_DIR=/tmp/skia/out/Release-x64 \
            -DSKIA_LIBRARY=/tmp/skia/out/Release-x64/libskia.a \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTS=OFF \
            -DENABLE_UPDATER=OFF \
            -G Ninja \
            ..
          ninja aseprite
          echo "::endgroup::"

          echo "::group::Copy binary to cache"
          mkdir -p /tmp/aseprite-build
          cp /tmp/aseprite-src/build/bin/aseprite /tmp/aseprite-build/
          echo "::endgroup::"

      - name: Install Aseprite CLI
        run: |
          sudo cp /tmp/aseprite-build/aseprite /usr/local/bin/
          echo "Aseprite version: $(aseprite --version)"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq imagemagick

      - name: Export sprites
        run: |
          chmod +x .github/scripts/export-aseprite.sh
          .github/scripts/export-aseprite.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Generate README
        run: |
          chmod +x .github/scripts/generate-readme.sh
          .github/scripts/generate-readme.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate assets & README [skip ci]"
          git push
