name: Generate Assets & README

on:
  push:
    branches: [main]

concurrency:
  group: generate-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aseprite CLI (Docker)
        run: |
          echo "::group::Pull Docker image"
          docker pull al1ydn/aseprite-linux-build:v1.3.2
          echo "::endgroup::"

          echo "::group::Install aseprite wrapper"
          chmod +x .github/scripts/aseprite-wrapper.sh
          mkdir -p "$HOME/bin"
          ln -sf "$GITHUB_WORKSPACE/.github/scripts/aseprite-wrapper.sh" "$HOME/bin/aseprite"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "::endgroup::"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq imagemagick

      - name: Export sprites
        run: |
          chmod +x .github/scripts/export-aseprite.sh
          .github/scripts/export-aseprite.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Generate README
        run: |
          chmod +x .github/scripts/generate-readme.sh
          .github/scripts/generate-readme.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate assets & README [skip ci]"
          git push
